name: Source security

on:
  workflow_call:
    secrets:
      CONFIGS_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  scan:
    name: security-${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [secrets, sast, workflows, iac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.repository != 'JanKrajewskiIT/velvetconfigs'
        with:
          repository: JanKrajewskiIT/velvetconfigs
          ref: b3237eb74b340e5d039a3383361d683d04629028 # v3.7.10
          path: tooling
          persist-credentials: false
          token: ${{ secrets.CONFIGS_READ_TOKEN || github.token }}
          sparse-checkout: |
            scripts
            security
      - name: Select local Configs policy
        if: github.repository == 'JanKrajewskiIT/velvetconfigs'
        run: |
          mkdir tooling
          cp -R source/scripts source/security tooling/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Install checksum-pinned scanner
        env:
          CHECK: ${{ matrix.check }}
        run: |
          case "$CHECK" in
            secrets) node tooling/scripts/security-tools.mjs gitleaks ;;
            workflows) node tooling/scripts/security-tools.mjs actionlint ;;
            iac) node tooling/scripts/security-tools.mjs trivy ;;
            sast) node tooling/scripts/security-tools.mjs opengrep ;;
            *) exit 1 ;;
          esac
      - name: Read pinned SAST rules commit
        if: matrix.check == 'sast'
        id: rules
        run: echo "commit=$(node -p "require('./tooling/security/tools.json').semgrepRules.commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.check == 'sast'
        with:
          repository: semgrep/semgrep-rules
          ref: ${{ steps.rules.outputs.commit }}
          path: rules
          persist-credentials: false
      - name: Run source security gate
        env:
          CHECK: ${{ matrix.check }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/scan-source.mjs "$CHECK" source reports rules
      - name: Upload restricted security report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-${{ matrix.check }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7
