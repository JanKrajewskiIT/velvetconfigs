name: CodeQL analysis

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL security and quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure security and reliability analysis
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          source-root: ${{ inputs.working-directory }}
          config: |
            name: Velvet security and quality
            queries:
              - uses: security-and-quality
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/build/**'
              - '**/reports/**'
              - '**/.agents/**'
              - '**/.deployment/**'
              - '**/api/schema/**'
              - '**/api-contracts/**'
              - '**/velvet/**'
      - name: Analyze without installing or building the application
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: velvet/javascript-security-and-quality
          output: codeql-results
          upload: never
          upload-database: false
          wait-for-processing: false
      - name: Block high security findings and quality errors
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          const files = readdirSync('codeql-results').filter((name) => name.endsWith('.sarif'));
          if (!files.length) throw new Error('Missing CodeQL report.');
          const output = 'reports/codeql';
          const omittedFields = new Set(['snippet', 'contents', 'invocations', 'insertedContent', 'webRequest', 'webResponse']);
          mkdirSync(output, { recursive: true });
          const resolveRule = (tool, result) => {
            const reference = result.rule ?? {};
            const componentReference = reference.toolComponent;
            const extensions = tool.extensions ?? [];
            if (!Array.isArray(extensions)) throw new Error('Invalid CodeQL tool extensions.');
            let component = tool.driver;
            if (componentReference !== undefined) {
              if (componentReference.index !== undefined && componentReference.index !== -1) {
                if (!Number.isInteger(componentReference.index) || componentReference.index < 0)
                  throw new Error('Invalid CodeQL tool component index.');
                component = extensions[componentReference.index];
              } else {
                if (componentReference.name === undefined && componentReference.guid === undefined)
                  throw new Error('Missing CodeQL tool component identity.');
                const matches = [tool.driver, ...extensions].filter((item) =>
                  item &&
                  (componentReference.name === undefined || item.name === componentReference.name) &&
                  (componentReference.guid === undefined || item.guid === componentReference.guid),
                );
                if (matches.length !== 1) throw new Error('Unknown or ambiguous CodeQL tool component.');
                component = matches[0];
              }
              if (
                !component ||
                (componentReference.name !== undefined && component.name !== componentReference.name) ||
                (componentReference.guid !== undefined && component.guid !== componentReference.guid)
              ) throw new Error('Inconsistent CodeQL tool component reference.');
            }
            if (!Array.isArray(component?.rules)) throw new Error('Missing CodeQL rule metadata.');
            const id = reference.id ?? result.ruleId;
            const index = reference.index ?? result.ruleIndex;
            if (
              (reference.id !== undefined && result.ruleId !== undefined && reference.id !== result.ruleId) ||
              (reference.index !== undefined && result.ruleIndex !== undefined && reference.index !== result.ruleIndex)
            ) throw new Error('Inconsistent CodeQL rule reference.');
            let rule;
            if (index !== undefined && index !== -1) {
              if (!Number.isInteger(index) || index < 0) throw new Error('Invalid CodeQL rule index.');
              rule = component.rules[index];
            } else {
              const matches = component.rules.filter((item) =>
                (id !== undefined || reference.guid !== undefined) &&
                (id === undefined || item.id === id) &&
                (reference.guid === undefined || item.guid === reference.guid),
              );
              if (matches.length !== 1) throw new Error('Unknown or ambiguous CodeQL rule.');
              rule = matches[0];
            }
            if (
              !rule ||
              (id !== undefined && rule.id !== id) ||
              (reference.guid !== undefined && rule.guid !== reference.guid)
            ) throw new Error('Inconsistent CodeQL rule metadata.');
            return rule;
          };
          let blocked = 0;
          for (const file of files) {
            const report = JSON.parse(readFileSync(`codeql-results/${file}`, 'utf8'));
            if (!Array.isArray(report.runs) || !report.runs.length) throw new Error('Invalid CodeQL report.');
            writeFileSync(
              `${output}/${file}`,
              `${JSON.stringify(report, (key, value) => omittedFields.has(key) ? undefined : value, 2)}\n`,
            );
            for (const run of report.runs) {
              if (!Array.isArray(run.results) || !run.tool?.driver)
                throw new Error('Incomplete CodeQL report.');
              if (run.invocations?.some((item) => item.executionSuccessful === false))
                throw new Error('CodeQL execution failed.');
              for (const result of run.results) {
                const rule = resolveRule(run.tool, result);
                const security = rule.properties?.['security-severity'];
                const level = result.level ?? rule.defaultConfiguration?.level;
                if (security !== undefined && !Number.isFinite(Number(security)))
                  throw new Error('Invalid security severity.');
                if (Number(security) >= 7 || (security === undefined && level === 'error')) blocked += 1;
              }
            }
          }
          if (blocked) throw new Error(`${blocked} blocking CodeQL findings. Inspect the codeql-sarif artifact.`);
          NODE
      - name: Upload CodeQL SARIF reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-sarif
          path: reports/codeql/*.sarif
          if-no-files-found: error
          retention-days: 7
