name: SPA security report
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: velvet-spa
      waf-enabled:
        description: Scan and verify the WAF used by the deployment.
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact-name }}
          path: spa
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: spa
          load: true
          tags: velvet-spa:verified
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=spa-runtime
          cache-to: type=gha,mode=max,scope=spa-runtime
      - name: Verify Nginx and HTTP configuration
        id: http
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: node spa/verify-spa.mjs velvet-spa:verified
      - name: Install checksum-pinned image scanner
        run: node spa/scripts/security-tools.mjs trivy
      - name: Scan runtime image and generate SBOM
        id: image
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: node spa/scripts/scan-image.mjs velvet-spa:verified reports/image
      - name: Scan WAF runtime image
        id: waf
        continue-on-error: true
        if: ${{ !cancelled() && inputs.waf-enabled }}
        run: |
          waf=$(node -p "require('./spa/security/tools.json').images.waf")
          node spa/scripts/scan-image.mjs "$waf" reports/waf
      - name: ZAP baseline and deployment security checks
        id: dast
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          SECURITY_PROFILE: ${{ inputs.waf-enabled && 'waf' || 'spa' }}
        run: node spa/scripts/verify-spa-security.mjs velvet-spa:verified reports/dast "$SECURITY_PROFILE"
      - name: Upload image security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spa-security
          path: reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Summarize SPA security checks
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p reports
          jq 'with_entries(select(.key != "")) | map_values(.outcome)' <<< "$OUTCOMES" > reports/checks.json
          {
            echo '## SPA security report'
            echo ''
            echo 'Findings and scanner failures do not gate deployment.'
            echo ''
            echo '| Check | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value) |"' reports/checks.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; . != "failure")' reports/checks.json
      - name: Retain SPA check outcomes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spa-security-summary
          path: reports/checks.json
          if-no-files-found: warn
          retention-days: 7
    timeout-minutes: 40
