name: Verify package

on:
  workflow_call:
    secrets:
      GHCR_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@jankrajewskiit'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        # Spec 19 window for GHSA-vfj7-8cjw-p6xm (braces, no fix); restore --audit-level=high when fixed.
        run: npm audit --audit-level=critical

      - name: Verify
        run: npm run verify
