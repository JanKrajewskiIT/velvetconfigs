name: Publish
on:
  push:
    tags:
      - v*
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    with:
      package-artifact: velvet-package
      build-script: ''
    permissions:
      contents: read
      packages: read
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  publish:
    needs: build
    uses: ./.github/workflows/publish-package.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
permissions:
  contents: read
