name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  check-version:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare tag with package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)."
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

  publish:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jankrajewskiit'
          cache: 'npm'

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          case "$PKG_VERSION" in
            *-*)
              CHANNEL="${PKG_VERSION#*-}"
              CHANNEL="${CHANNEL%%.*}"
              npm publish --provenance --tag "$CHANNEL"
              ;;
            *)
              npm publish --provenance
              ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
