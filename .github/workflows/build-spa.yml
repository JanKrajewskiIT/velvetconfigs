name: Build SPA image
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: velvet-spa
      image-artifact:
        type: string
        default: velvet-spa-image
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact-name }}
          path: spa
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: spa
          load: true
          tags: velvet-spa:verified
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=spa-runtime
          cache-to: type=gha,mode=max,scope=spa-runtime
      - name: Install checksum-pinned SBOM generator
        run: node spa/scripts/security-tools.mjs trivy
      - name: Generate image dependency inventory without vulnerability scanning
        run: |
          mkdir -p reports/image
          trivy image --quiet --format cyclonedx --output reports/image/sbom.cdx.json velvet-spa:verified
      - name: Retain image dependency inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spa-sbom
          path: reports/
          if-no-files-found: error
          retention-days: 7
      - name: Save verified image
        run: docker save velvet-spa:verified | gzip > spa-image.tar.gz
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.image-artifact }}
          path: spa-image.tar.gz
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 30
