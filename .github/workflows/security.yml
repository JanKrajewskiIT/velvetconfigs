name: Periodic security
on:
  schedule:
    - cron: 23 5 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
concurrency:
  group: periodic-security
  cancel-in-progress: false
jobs:
  source:
    uses: ./.github/workflows/security-source.yml
    secrets:
      CONFIGS_READ_TOKEN: ${{ secrets.CONFIGS_READ_TOKEN }}
  dependencies:
    uses: ./.github/workflows/security-dependencies.yml
    with:
      working-directory: .
      node-version-file: .nvmrc
    secrets:
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
