version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: 'node'
    groups:
      eslint:
        patterns:
          - '@eslint/*'
          - 'eslint'
          - 'eslint-*'
          - 'typescript-eslint'
      stylelint:
        patterns:
          - 'stylelint'
          - 'stylelint-*'
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-*'
      vite:
        patterns:
          - 'vite'
          - 'vite-*'
      tooling:
        patterns:
          - 'husky'
          - 'lint-staged'
          - 'publint'
          - 'globals'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
