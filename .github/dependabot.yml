version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      eslint:
        patterns:
          - '@eslint/*'
          - eslint
          - eslint-*
          - typescript-eslint
      stylelint:
        patterns:
          - stylelint
          - stylelint-*
      typescript:
        patterns:
          - typescript
          - '@typescript/*'
          - '@types/node'
      vite:
        patterns:
          - vite
          - vite-*
      velvet:
        patterns:
          - '@jankrajewskiit/*'
      tooling:
        patterns:
          - prettier
          - prettier-*
          - husky
          - lint-staged
          - publint
          - '@arethetypeswrong/*'
          - size-limit
          - '@size-limit/*'
      solid:
        patterns:
          - solid-js
          - '@solidjs/*'
          - solid-*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    schedule:
      interval: weekly
    directories:
      - /docker
      - /security
