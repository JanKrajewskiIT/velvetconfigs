set $spa_cache_control 'no-cache';
add_header Cache-Control $spa_cache_control always;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/wasm image/svg+xml;

location = /index.html {
    set $spa_cache_control 'no-cache, no-store, must-revalidate';
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~* '^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|png|jpg|jpeg|gif|ico|svg|wasm|woff|woff2|ttf|eot)$' {
    if (-f $request_filename) {
        set $spa_cache_control 'public, max-age=31536000, immutable';
    }
    try_files $uri =404;
}
