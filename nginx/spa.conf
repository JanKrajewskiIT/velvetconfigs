# Generated from nginx/index.mjs and locations.conf; run npm run nginx:sync.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16m;
    client_body_temp_path /tmp/client-body;

    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'DENY' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    set $spa_cache_control 'no-cache';
    add_header Cache-Control $spa_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/wasm image/svg+xml;

    location = /index.html {
        set $spa_cache_control 'no-cache, no-store, must-revalidate';
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* '^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|png|jpg|jpeg|gif|ico|svg|wasm|woff|woff2|ttf|eot)$' {
        if (-f $request_filename) {
            set $spa_cache_control 'public, max-age=31536000, immutable';
        }
        try_files $uri =404;
    }
}
