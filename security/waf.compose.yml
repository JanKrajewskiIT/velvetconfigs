services:
  waf:
    image: docker.io/owasp/modsecurity-crs:4.30.0-nginx-alpine-202610180210@sha256:873ce68a658d2e3b61484a8a24d215f7d15456e7ce5aec5e7114bf000d743365
    restart: unless-stopped
    environment:
      PORT: '8080'
      MODSEC_RULE_ENGINE: ${WAF_MODE:-DetectionOnly}
      MODSEC_AUDIT_LOG_PARTS: AHZ
      MODSEC_RESP_BODY_ACCESS: 'Off'
      MODSEC_REQ_BODY_LIMIT: '16777216'
      MODSEC_REQ_BODY_NOFILES_LIMIT: ${WAF_JSON_BODY_LIMIT:-1048576}
      BLOCKING_PARANOIA: '1'
      NGINX_X_FORWARDED_PROTO: https
      NGINX_X_FORWARDED_PORT: '443'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
