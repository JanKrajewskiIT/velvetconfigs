services:
  waf:
    image: docker.io/owasp/modsecurity-crs:4.30.0-nginx-alpine-202611190211@sha256:f7b4ec036553aa65e65fe792394099f597d6130465e63ff58d84f087617f5412
    restart: unless-stopped
    environment:
      PORT: '8080'
      MODSEC_RULE_ENGINE: ${WAF_MODE:-DetectionOnly}
      MODSEC_AUDIT_LOG_PARTS: AHZ
      MODSEC_RESP_BODY_ACCESS: 'Off'
      MODSEC_REQ_BODY_LIMIT: '16777216'
      MODSEC_REQ_BODY_NOFILES_LIMIT: ${WAF_JSON_BODY_LIMIT:-1048576}
      BLOCKING_PARANOIA: '1'
      NGINX_X_FORWARDED_PROTO: https
      NGINX_X_FORWARDED_PORT: '443'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
