services:
  waf:
    image: docker.io/owasp/modsecurity-crs:nginx@sha256:133267aa811e1a57a23b52ef04b3c30e802bcbe5454588f6d6af1f69f4b2b667
    restart: unless-stopped
    environment:
      PORT: '8080'
      MODSEC_RULE_ENGINE: ${WAF_MODE:-DetectionOnly}
      MODSEC_AUDIT_LOG_PARTS: AHZ
      MODSEC_RESP_BODY_ACCESS: 'Off'
      MODSEC_REQ_BODY_LIMIT: '16777216'
      MODSEC_REQ_BODY_NOFILES_LIMIT: ${WAF_JSON_BODY_LIMIT:-1048576}
      BLOCKING_PARANOIA: '1'
      NGINX_X_FORWARDED_PROTO: https
      NGINX_X_FORWARDED_PORT: '443'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
